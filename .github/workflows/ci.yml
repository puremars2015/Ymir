name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PI_VERSION: 1.0.0

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # 整合測試會啟動真正的 Pi 程序（對 Fake LLM）；版本需與 runtime/agent/Containerfile 一致。
      - name: Install Pi coding agent
        run: npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"

      - name: Restore
        run: dotnet restore Ymir.slnx

      - name: Format check
        run: dotnet format Ymir.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Ymir.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Ymir.slnx --no-build --configuration Release

  frontend:
    name: Angular lint, test & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  runtime-image:
    name: Agent runtime image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build image (rootless Podman)
        run: podman build --build-arg "PI_VERSION=${PI_VERSION}" -t localhost/ymir/agent-runtime:ci -f runtime/agent/Containerfile runtime/agent

      - name: Smoke test
        run: |
          podman run --rm --init --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp --tmpfs /home/agent \
            localhost/ymir/agent-runtime:ci sh -c 'test "$(id -u)" = 1000 && pi --version'
