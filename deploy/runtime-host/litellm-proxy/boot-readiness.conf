# 與 Quadlet 範本一致；供既有主機使用，不覆蓋 image、network 或 nginx 設定。
# Bridge 在 system manager，proxy 在 user manager，After= 無法跨 manager 排序。
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/timeout 60 /bin/sh -c 'until test -S /run/ymir-litellm/litellm.sock; do sleep 1; done'
TimeoutStartSec=90
Restart=on-failure
RestartSec=10
