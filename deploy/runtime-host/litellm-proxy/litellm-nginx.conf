# ymir-litellm-proxy 的 nginx 設定：Agent → litellm:4000 → Unix socket → 主機 LiteLLM。
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  # 必要：每次模型呼叫都送出完整對話歷史與 base64 圖片（附件單檔 50 MB，base64 約 1.33 倍）。
  # 沒有這行時 nginx 預設上限 1 MB，對話一變長就回 413，使用者只看到「模型發生錯誤，請稍後再試」。
  client_max_body_size 100m;
  proxy_request_buffering off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 4000;
    location / {
      proxy_pass http://unix:/bridge/litellm.sock:;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:4000;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
