# LiteLLM sample：MiniMax 國際站 + OpenRouter，ADR-0004 / SA §19。
# 啟動方式見同目錄 README.md；金鑰只放在 .env（已由 .gitignore 排除）。
model_list:
  # OpenRouter：第一個 openrouter/ 是 LiteLLM provider，後面是 OpenRouter 模型 ID。
  # OpenRouter 金鑰僅由 LiteLLM 使用；Ymir 使用者仍取得限定模型的 virtual key。
  - model_name: openrouter-sonnet-5.5
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: openrouter-gpt-6.1-sol
    litellm_params:
      model: openrouter/openai/gpt-6.1-sol
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: openrouter-gpt-6-luna
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: openrouter-haiku-5.5
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # MiniMax 國際站的 OpenAI 相容端點。模型名稱依訂閱方案而定，在 MiniMax 後台確認後修改 openai/ 後面的名稱。
  - model_name: minimax
    litellm_params:
      model: openai/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
    # 沿用 minimax alias，避免既有開放清單與個人授權失效；已不再呼叫 M2。
    # MiniMax 官方標準 pay-as-you-go 單價（美元 / token）；訂閱方案需依實際帳單核對。
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.00000006
      cache_creation_input_token_cost: 0.000000375

  - model_name: minimax-m3
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
    # Standard、輸入 <= 512k 的單價；更長輸入／Priority 費用較高，需另行核對帳單。
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.00000006

  # 開發 / 離線驗證用：轉給 Ymir 的 Fake LLM（dotnet run --project tests/Ymir.Testing.FakeLlm），不需要任何金鑰。
  - model_name: fake-model
    litellm_params:
      model: openai/fake-model
      api_base: os.environ/FAKE_LLM_BASE
      api_key: dev-key

general_settings:
  # 呼叫 proxy 需要的金鑰（Ymir API 使用）；不得放進 Agent container（ADR-0004）。
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # 不把 prompt / 回應內容送到任何外部服務。
  telemetry: false
  drop_params: true
