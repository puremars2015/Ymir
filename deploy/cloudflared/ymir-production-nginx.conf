# 正式入口：Tunnel -> ymir-web:80 -> Production API（含 Angular）。
# host network 僅監聽 loopback，不對 LAN 公開；API 仍只監聽 5080。
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # cloudflared 到 nginx 是 HTTP，保留原始 HTTPS，不能用 $scheme 覆蓋。
    map $http_x_forwarded_proto $origin_proto {
        default $scheme;
        https https;
        http http;
    }
    server {
        listen 127.0.0.1:80;
        server_name _;
        client_max_body_size 50m;

        location = /health { return 404; }
        location = /alive { return 404; }
        location = /api/dev { return 404; }
        location ^~ /api/dev/ { return 404; }

        location / {
            proxy_pass http://127.0.0.1:5080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
